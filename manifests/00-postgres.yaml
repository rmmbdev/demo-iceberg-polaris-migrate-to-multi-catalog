# Polaris metastore. Mirrors the prod relational-jdbc persistence backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-polaris
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-polaris }
  template:
    metadata:
      labels: { app: postgres-polaris }
    spec:
      containers:
        - name: postgres
          image: postgres:17.2-bookworm
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: postgres-secrets }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-polaris
spec:
  selector: { app: postgres-polaris }
  ports:
    - port: 5432
      targetPort: 5432
